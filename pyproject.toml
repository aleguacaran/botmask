[project]
name = "botmask"
version = "0.1.4"
description = "Containerized stealth browser automation toolkit (Brave + Patchright)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "patchright",
    "python-dotenv",
    "browserforge",
    "PyAutoGUI",
]

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
where = ["src"]
