[project]
name = "botmask"
version = "0.1.0"
description = "Containerized human-behavior browser automation toolkit (Brave + Patchright)"
requires-python = ">=3.10"
dependencies = [
    "patchright",
    "python-dotenv",
    "browserforge",
    "PyAutoGUI",
]

[tool.setuptools.packages.find]
where = ["src"]
